<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fransızca Koç</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2563eb"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});</script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#4f46e5;--pri2:#eef2ff;--ok:#059669;--bad:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:max(12px,env(safe-area-inset-top)) 14px calc(76px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto}
h1{font-size:24px;margin:6px 0 2px}h2{font-size:19px;margin:14px 0 8px}
.sub{color:var(--mut);font-size:14px;margin:0 0 10px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--pri);color:#fff;font-weight:600}
button.ghost{background:var(--pri2);color:var(--pri)}button.sm{padding:7px 11px;font-size:14px;min-width:40px;min-height:36px}
button:disabled{opacity:.5}
.chip{background:var(--pri2);color:var(--pri);padding:8px 13px;border-radius:999px;font-weight:600;font-size:15px}
.chip.sel{background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{padding:16px 10px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;color:var(--mut);font-size:12px;padding:6px 2px;border-radius:10px}nav button b{display:block;font-size:20px}nav button.on{color:var(--pri);background:var(--pri2)}
.flash{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer}
.flash .w{font-size:34px;font-weight:800}.flash .e{color:var(--mut);font-style:italic}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);margin:8px 0}
.opt.ok{border-color:var(--ok);background:#ecfdf5}.opt.bad{border-color:var(--bad);background:#fef2f2}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
#msgs{display:flex;flex-direction:column;gap:8px;min-height:240px}
.m{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;line-height:1.4}
.m.ai{background:#fff;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.08)}.m.me{background:var(--pri);color:#fff;align-self:flex-end}
.m.tip{background:#fffbeb;color:#92400e;align-self:flex-start;font-size:14px;border:1px solid #fde68a}
textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;resize:none}
.lv{display:inline-block;background:var(--pri);color:#fff;border-radius:8px;padding:2px 9px;font-weight:800}
.small{font-size:13px;color:var(--mut)}
</style>
</head>

<nav id="nav"></nav>

];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
let S={lvl:'A1',topic:'top',known:{},extra:{},streak:0,last:'',today:0,tested:false,sd:{},bd:{},pd:{},ex:{},nb:{},xp:0,dxp:{},goal:30,bg:{},mis:[],fa:{},cnt:{},lbx:-1,npd:10,ni:{d:0,n:0},bk:0};
try{const s=JSON.parse(localStorage.getItem('fc_v1')||'null');if(s)S=Object.assign(S,s);}catch(e){}
const save=()=>{try{localStorage.setItem('fc_v1',JSON.stringify(S));}catch(e){}};
const deck=(t=S.topic,l=S.lvl)=>DECK[t][l].concat((S.extra[t+l]||[]));
const dayKey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function bump(n=10){const t=dayKey(new Date());if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=S.last===dayKey(y)?S.streak+1:1;S.last=t;S.today=0;}S.today++;xpa(n);}
// ---- ses ----
let TTS=null,DICT=null,SAMPLE=null;
const canWeb=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
function say(t,r){
  if(TTS){TTS.speak(t,{language:'en'}).catch(()=>{});return;}
  if(canWeb){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';pv(u);u.rate=r||.8;clearTimeout(window.__sy);window.__sy=setTimeout(()=>{try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}},180);}catch(e){}}
}
const canSay=()=>!!TTS||canWeb;
const VL='fr-FR';let VOICES=[];
function loadV(){try{VOICES=speechSynthesis.getVoices()||[];}catch(e){}}
if(canWeb){loadV();try{speechSynthesis.addEventListener('voiceschanged',loadV);}catch(e){}}
function vScore(v){const n=(v.name||'').toLowerCase();let s=0;if(/natural|neural|premium|enhanced|wavenet/.test(n))s+=50;if(/google/.test(n))s+=30;if(/espeak|compact/.test(n))s-=50;if(v.lang.replace('_','-').toLowerCase()===VL.toLowerCase())s+=10;if(v.localService===false)s+=5;return s;}
function vList(){const p=VL.slice(0,2).toLowerCase();return VOICES.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(p)).sort((a,b)=>vScore(b)-vScore(a));}
function pv(u){try{let pick=null;let sv=null;try{sv=localStorage.getItem('vc_'+VL);}catch(e){}const l=vList();if(sv)pick=l.find(v=>v.voiceURI===sv);if(!pick)pick=l[0];if(pick){u.voice=pick;u.lang=pick.lang;}}catch(e){}}
// ---- görünüm ----
let view='home';
const HASNET=typeof Peer!=='undefined';
const NAV=[['home','🏠','Ana'],['story','📖','Hikâye'],['work','🧠','Çalış']].concat(HASNET?[['duel','⚔️','Yarış']]:[],[['prog','📊','İlerleme']]);
const WORKV=['cards','quiz','nb','nbr','dict','speak','cloze','mis','tr','irr','dlg','gr','pic','ph','em','num','pron','ten','rdy','gen','conj','mq','cult','pr2','sen','kal','kq','gap','wri','plan','srs','lis'];
function renderNav(){$('#nav').innerHTML=NAV.map(n=>`<button data-v="${n[0]}" class="${view===n[0]||(view==='test'&&n[0]==='home')||(SUBV.includes(view)&&n[0]==='story')||(WORKV.includes(view)&&n[0]==='work')?'on':''}"><b>${n[1]}</b>${n[2]}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});}
function render(){stopAudio();if(view!=='duel'&&DU&&!DU.keep)duelLeave();renderNav();({home:rHome,cards:rCards,quiz:rQuiz,chat:rChat,test:rTest,duel:rDuel,story:rStoryHome,reader:rReader,build:rBuild,prac:rPrac,pdk:rPdk,exam:rExam,work:rWork,nb:rNb,nbr:rNbr,dict:rDict,speak:rSpeak,cloze:rCloze,mis:rMis,tr:rTr,irr:rIrr,dlg:rDlg,gr:rGr,pic:rPic,ph:rPh,em:rEm,num:rNum,pron:rPron,ten:rTen,rdy:rRdy,gen:rGen,conj:rConj,mq:()=>rMq(MQ&&MQ.id||'hom'),cult:rCult,pr2:rPr2,sen:rSen,kal:rKal,kq:rKq,gap:rGap,wri:rWri,plan:rPlan,srs:rSrs,lis:rLis,prog:rProg})[view]();window.scrollTo(0,0);}
const chips=()=>`<div class="row">${LEVELS.map(l=>`<button class="chip ${l===S.lvl?'sel':''}" data-l="${l}">${l}</button>`).join('')}</div>`;
const tchips=()=>`<div class="row">${Object.entries(TOPICS).map(([k,v])=>`<button class="chip ${k===S.topic?'sel':''}" data-t="${k}">${v.ic} ${v.n}</button>`).join('')}</div>`;
function wire(){document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.lvl=b.dataset.l;save();render();});document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.topic=b.dataset.t;save();render();});}
function rHome(){
  const kn=Object.keys(S.known).length;
  $('#app').innerHTML=`<h1>Fransızca Koç</h1><p class="sub">A1'den C2'ye • Kelime • Dinleme • Konuşma</p>${restoreCard()}${goalCard()}

  wire();$('#lo').onclick=e=>{e.preventDefault();logout();};$('#goTest').onclick=()=>{view='test';tq=null;render();};$('#gS').onclick=()=>{view='story';render();};$('#gC').onclick=()=>{view='cards';render();};$('#gQ').onclick=()=>{view='quiz';qz=null;render();};if($('#gD'))$('#gD').onclick=()=>{view='duel';render();};wireHome();
}
// ---- kartlar ----

  preloadAll();
  if(S.topic==='top'&&!DECK.top[S.lvl].length&&LK[S.lvl]){$('#app').innerHTML=`<h2>🃏 Kelime Kartları</h2>${chips()}<div style="margin-top:8px">${tchips()}</div><div class="card small">Yükleniyor…</div>`;wire();loadLevel(S.lvl).then(()=>{if(view==='cards')rCards();});return;}
  const d=deck();if(order.key!==S.topic+S.lvl+d.length){order=shuffle(d.map((_,i)=>i).filter(i=>!S.known[d[i].w]));order.key=S.topic+S.lvl+d.length;ci=0;flip=false;}
  if(!d.length){$('#app').innerHTML=`<h2>🃏 Kelime Kartları</h2>${chips()}<div style="margin-top:8px">${tchips()}</div><div class="card">Bu seviyede kelime yok ya da yüklenemedi.</div>`;wire();return;}
  if(!order.length){$('#app').innerHTML=`<h2>🃏 Kelime Kartları</h2>${chips()}<div style="margin-top:8px">${tchips()}</div><div class="card" style="text-align:center"><div style="font-size:40px">🎉</div><b>Bu destedeki tüm kelimeleri biliyorsun!</b><p class="small">✅ ${d.filter(x=>S.known[x.w]).length} kelime bilinenlerde.</p><p class="small">Başka bir seviye ya da konu seçerek devam edebilirsin.</p><p class="small"><a href="#" id="rk" style="color:var(--mut)">Bilinenleri sıfırla</a></p></div>`;wire();$('#rk').onclick=e=>{e.preventDefault();if(!confirm('Bu destedeki \"biliyorum\" işaretleri silinsin mi?'))return;d.forEach(x=>{delete S.known[x.w];});save();order=[];order.key='';rCards();};return;}
  if(ci>=order.length)ci=0;
  const w=d[order[ci]];
  $('#app').innerHTML=`<h2>🃏 Kelime Kartları</h2>${chips()}<div style="margin-top:8px">${tchips()}</div>
  <div class="card flash" id="fl">${flip?`${emoBig(w.w)}<div class="w" style="font-size:26px">${esc(w.tr)}</div>${ipaLine(w.w)}${exHtml(w)}`:`${emoBig(w.w)}<div class="w">${esc(w.w)}</div>${ipaLine(w.w)}<div class="small">Çevirmek için dokun</div>`}</div>
  <div class="row"><button class="ghost" id="sp" ${canSay()?'':'hidden'}>🔊 Dinle</button><button class="ghost" id="ag">🔁 Bilmiyorum</button><button class="ghost" id="nbk">📒 Deftere</button><button class="ghost" id="pv">← Önceki</button><button class="ghost" id="sk">Atla →</button><button id="kn">✓ Biliyorum</button></div>
  <p class="small">Kalan: ${order.length} kelime • ✅ ${d.filter(x=>S.known[x.w]).length} biliyorum</p><p class="small">✓ Biliyorum: kart bir daha gelmez • 🔁 Bilmiyorum: birkaç kart sonra tekrar gelir • 📒 Deftere: kelimeyi tekrar defterine ekler</p>`;
  wire();
  $('#fl').onclick=()=>{flip=!flip;if(flip)say(w.w);rCards();};
  $('#sp').onclick=()=>say(w.ex&&flip?w.ex:w.w);

let qz=null;
function mkQs(words,lv,n){
  const d=shuffle(words).slice(0,n),pool=Object.values(DECK).map(t=>t[lv]).flat();
  const qs=d.map((w,i)=>{
    const t=i%3;const sn=new Set([w.tr]);const others=shuffle(pool.filter(x=>x.w!==w.w)).filter(x=>x.tr&&!sn.has(x.tr)&&sn.add(x.tr));
    if(t===0)return {q:`“${w.w}” ne demek?`,a:w.tr,o:shuffle([w.tr,...others.slice(0,3).map(x=>x.tr)]),say:w.w};
    if(t===1)return {q:`“${w.tr}” Fransızcada hangisi?`,a:w.w,o:shuffle([w.w,...others.slice(0,3).map(x=>x.w)]),say:w.w};
    const re=new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    const cl=re.test(w.ex)?w.ex.replace(re,'_____'):null;
    if(!cl)return {q:`“${w.w}” ne demek?`,a:w.tr,o:shuffle([w.tr,...others.slice(0,3).map(x=>x.tr)]),say:w.w};
    return {q:`Boşluğu doldur: ${cl}`,a:w.w,o:shuffle([w.w,...others.slice(0,3).map(x=>x.w)]),say:w.ex};
  });
  return qs;
}
function mkQuiz(){const dk=deck(),un=dk.filter(x=>!S.known[x.w]);qz={qs:mkQs(un.length>=10?un:dk,S.lvl,10),i:0,c:0,done:false,lock:false};}

function apiMsgs(){

function duelHost(name,n=0){
  duelLeave();const code=String(1000+Math.floor(Math.random()*9000));let peer;
  try{peer=new Peer('ecq-'+code);}catch(e){dmsg('Bağlantı kurulamadı.');return;}
  const d=DU={role:'host',peer,code,conns:{},players:[{id:'h',name,score:0,lvl:S.lvl}],topic:S.dall?'all':S.topic,phase:'lobby',me:'h',nid:1,keep:true,ui:{}};

function duelJoin(name,code){

  const fail=t=>{if(DU!==d)return;duelLeave();dmsg(t);};
  const to=setTimeout(()=>fail('Oda bulunamadı. Kodu kontrol et.'),15000);
  peer.on('error',e=>{if(d.joined)return;clearTimeout(to);fail(e&&e.type==='peer-unavailable'?'Bu kodda oda yok.':'İnternet bağlantısı kurulamadı.');});

  const opts=[];
  words.forEach((t,i)=>{const k=core(t);if(!k)return;const lc=k.c.toLowerCase().replace('’',"'"),pv=(words[i-1]||'').toLowerCase();
    if(AG[lc]&&!['if','wish'].includes(pv))opts.push({i,lc,k:'v'});});
  const sw=[];for(let i=1;i<words.length-1;i++){const a=core(words[i]),b=core(words[i+1]);if(!a||!b||a.s||b.s||a.p||b.p)continue;const x=a.c.toLowerCase(),y=b.c.toLowerCase();if(x===y||PRON.has(x)||PRON.has(y))continue;sw.push(i);}
  if(opts.length&&Math.random()<.8){const o=pick(opts),w=words.slice();w[o.i]=repl(w[o.i],pick(AG[o.lc]));return {w,bad:[o.i]};}
  if(sw.length){const i=pick(sw),w=words.slice();[w[i],w[i+1]]=[w[i+1],w[i]];return {w,bad:[i,i+1]};}
  if(opts.length){const o=pick(opts),w=words.slice();w[o.i]=repl(w[o.i],pick(AG[o.lc]));return {w,bad:[o.i]};}
  return null;
}
function mkEx(p,type,all){
  const w=p.en.split(' ');
  if(type==='g'){ // dilbilgisi boşluğu
    const c=[];w.forEach((t,i)=>{const k=core(t);if(k&&AG[k.c.toLowerCase()])c.push(i);});if(!c.length)return null;
    const i=pick(c),k=core(w[i]),lc=k.c.toLowerCase(),a=k.c;const d=AG[lc].slice();if(AG3[lc])d.push(AG3[lc]);
    const cap=x=>a[0]===a[0].toUpperCase()?x[0].toUpperCase()+x.slice(1):x;
    const q=w.map((t,j)=>j===i?k.p+'_____'+k.s:t).join(' ');
    return {k:'g',q:'Doğru kelimeyi seç:\n'+q,o:shuffle([a,...d.slice(0,3).map(cap)]),a,tr:p.tr,f:p.f,en:p.en};
  }
  if(type==='c'){ // içerik kelimesi + Türkçe ipucu
    if(!p.tr)return null;const c=[];w.forEach((t,i)=>{const k=core(t);if(k&&k.c.length>=4&&!PRON.has(k.c.toLowerCase())&&!AG[k.c.toLowerCase()]&&i>0)c.push(i);});if(!c.length)return null;
    const i=pick(c),k=core(w[i]);const ds=shuffle([...new Set(all.flatMap(x=>x.en.split(' ')).map(core).filter(z=>z&&z.c.length>=4&&Math.abs(z.c.length-k.c.length)<=2&&z.c.toLowerCase()!==k.c.toLowerCase()&&!PRON.has(z.c.toLowerCase())).map(z=>z.c.toLowerCase()))]).slice(0,3);
    if(ds.length<3)return null;const cap=x=>k.c[0]===k.c[0].toUpperCase()?x[0].toUpperCase()+x.slice(1):x;
    return {k:'c',q:'Boşluğu doldur:\n'+w.map((t,j)=>j===i?k.p+'_____'+k.s:t).join(' ')+'\n🇹🇷 '+p.tr,o:shuffle([k.c,...ds.map(cap)]),a:k.c,f:p.f,en:p.en};
  }
  const cr=corrupt(w);if(!cr)return null;
  if(type==='r'){
    const alt=[cr.w.join(' ')];const c2=corrupt(w);if(c2&&c2.w.join(' ')!==alt[0]&&c2.w.join(' ')!==p.en)alt.push(c2.w.join(' '));
    if(alt[0]===p.en)return null;
    return {k:'r',q:'Hangisi doğru cümle?',o:shuffle([p.en,...alt]),a:p.en,f:p.f,en:p.en};
  }
  if(type==='e'){if(cr.w.join(' ')===p.en)return null;return {k:'e',q:'Hatalı kelimeyi bul (dokun):',words:cr.w,bad:cr.bad,a:p.en,f:p.f,en:p.en,wrong:cr.w.join(' ')};}
  return null;
}

const backupStr=()=>{const o=JSON.parse(JSON.stringify(S));delete o.lbx;return JSON.stringify(o);};
async function cloudSave(){const r=await syncCall('/sync/put',{data:backupStr()});if(r&&r.ok){S.bk=Date.now();save();}return !!(r&&r.ok);}
function autoBackup(){if(!API||!TG)return;if(Date.now()-(S.bk||0)<432e5)return;if(!S.xp&&!nbN())return;cloudSave();}

function startBuild(){
  const d=DATA[CUR.l],s=d.stories[CUR.i],en=spl(s.en),tr=spl(s.tr),al=en.length===tr.length;
  const cand=en.map((x,i)=>({x,i})).filter(o=>{const n=o.x.split(' ').length;return n>=4&&n<=14;});
  const picks=shuffle(cand).slice(0,5).sort((a,b)=>a.i-b.i).map(o=>({en:o.x,tr:al?tr[o.i]:null}));
  CUR.b={picks,k:0,ok:0,tiles:null,ans:[],done:false,tries:0};view='build';render();
}
const normQ=t=>t.replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\s+/g,' ').trim();
function rBuild(){
  const b=CUR.b,d=DATA[CUR.l],s=d.stories[CUR.i];

  <div class="card"><b>${p.tr?'Şunu Fransızca kur:':'Cümleyi dinle ve doğru sıraya diz:'}</b>${p.tr?`<p style="font-size:18px">${esc(p.tr)}</p>`:''}${canSay()?'<button class="ghost sm" id="sp">🔊 Dinle</button>':''}${!p.tr&&!canSay()?`<p class="small">İlk kelime: <b>${esc(p.en.split(' ')[0])}</b></p>`:''}</div>
  <div class="card" id="ans" style="min-height:64px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start">${b.ans.map((o,i)=>`<button class="chip sel" data-a="${i}">${esc(o.x)}</button>`).join('')||'<span class="small">Kelimelere dokunarak cümleyi kur…</span>'}</div>
  <div class="row" id="tl" style="margin:8px 0">${b.tiles.map(o=>`<button class="chip" data-t="${o.i}" ${used.has(o.i)?'disabled style="opacity:.25"':''}>${esc(o.x)}</button>`).join('')}</div>
  <div id="fbk"></div>

  $('#bk').onclick=()=>{view='reader';render();};
  if($('#sp'))$('#sp').onclick=()=>say(p.en);

  document.querySelectorAll('[data-a]').forEach(c=>c.onclick=()=>{if(b.done)return;b.ans.splice(+c.dataset.a,1);rBuild();});
  $('#cl').onclick=()=>{if(b.done)return;b.ans=[];rBuild();};
  $('#ck').onclick=()=>{
    const got=b.ans.map(o=>o.x).join(' '),ok=normQ(got)===normQ(p.en);
    if(ok){b.done=true;if(b.tries===0)b.ok++;say(p.en);$('#fbk').innerHTML=`<div class="card" style="background:#ecfdf5">✅ Doğru!<br><b>${esc(p.en)}</b></div><button id="go">Devam ➜</button>`;$('#ck').disabled=true;$('#go').onclick=()=>{b.k++;b.tiles=null;rBuild();};}
    else{b.tries++;if(b.tries===2)misAdd({t:'s',en:p.en,tr:p.tr});$('#fbk').innerHTML=`<div class="card" style="background:#fef2f2">❌ Henüz değil. ${b.tries>=2?`Doğrusu:<br><b>${esc(p.en)}</b>`:'Tekrar dene.'}</div>`;if(b.tries>=2){b.ans=[];$('#fbk').insertAdjacentHTML('beforeend','<button id="go">Devam ➜</button>');$('#go').onclick=()=>{b.k++;b.tiles=null;rBuild();};}}

const CON=[["can't","cannot"],["won't","will not"],["don't","do not"],["doesn't","does not"],["didn't","did not"],["isn't","is not"],["aren't","are not"],["wasn't","was not"],["weren't","were not"],["haven't","have not"],["hasn't","has not"],["hadn't","had not"],["couldn't","could not"],["wouldn't","would not"],["shouldn't","should not"],["mustn't","must not"],["i'm","i am"],["you're","you are"],["we're","we are"],["they're","they are"],["it's","it is"],["he's","he is"],["she's","she is"],["that's","that is"],["there's","there is"],["i've","i have"],["we've","we have"],["they've","they have"],["you've","you have"],["i'll","i will"],["we'll","we will"],["you'll","you will"],["they'll","they will"],["i'd","i would"],["let's","let us"]];
function normW(t){t=String(t).toLowerCase().replace(/[’‘']/g,' ').replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[\u0300-\u036f]/g,'');return t.replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);}
function lcs(a,b){const m=a.length,n=b.length,T=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)T[i][j]=a[i]===b[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  const A=new Set(),B=new Set();let i=0,j=0;while(i<m&&j<n){if(a[i]===b[j]){A.add(i);B.add(j);i++;j++;}else if(T[i+1][j]>=T[i][j+1])i++;else j++;}return {n:T[0][0],A,B};}
function rPdk(){

  <div id="fbk">${r?r.html:''}</div>`;

    const html=`<div class="card" style="background:${exact?'#ecfdf5':'#fffbeb'}">${exact?'✅ <b>Birebir doğru!</b>':skip?'Doğrusu:':'Yeşil: doğru kelimeler, kırmızı: farklı.'}${skip?'':`<p>${mine}</p>`}<p><b>${esc(s.en)}</b></p><p class="small">🇹🇷 ${esc(s.tr)}</p></div><button id="nx" style="width:100%">Devam ➜</button>`;
    CUR.res={text,html,exact};if(exact)CUR.ok++;rPdk();
    $('#nx').onclick=()=>{CUR.k++;CUR.res=null;rPdk();};
  };
  if(!r){$('#ck').onclick=()=>{const t=$('#inp').value.trim();if(!t)return;show(t,false);};$('#sk').onclick=()=>show($('#inp').value.trim(),true);}

function rPrac(){

// ---- Fransızca sayı, saat, tarih ----
const FU=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
const FT={2:'vingt',3:'trente',4:'quarante',5:'cinquante',6:'soixante'};
function fr100(n){ // 0..99
  if(n<17)return FU[n];
  if(n<20)return 'dix-'+FU[n-10];
  if(n<70){const t=Math.floor(n/10),u=n%10;return FT[t]+(u===0?'':u===1?' et un':'-'+FU[u]);}
  if(n<80){const u=n-60;return u===11?'soixante et onze':'soixante-'+fr100(u);}
  if(n===80)return 'quatre-vingts';
  return 'quatre-vingt-'+fr100(n-80);
}
function fr1000(n,fin){ // 0..999; fin: sondaki "s" (vingts/cents) yazılsın mı
  const h=Math.floor(n/100),r=n%100;let s='';
  if(h>0){s=(h===1?'cent':FU[h]+' cent');if(r===0&&h>1&&fin)s+='s';}
  if(r>0){const x=fr100(r);s+=(s?' ':'')+(r===80&&!fin?'quatre-vingt':x);}
  return s;
}
function numW(n){
  if(n===0)return 'zéro';
  const parts=[];let m=Math.floor(n/1e6),k=Math.floor((n%1e6)/1000),r=n%1000;
  if(m>0)parts.push(fr1000(m,false)+(m===1?' million':' millions'));
  if(k>0)parts.push((k===1?'':fr1000(k,false))+(k===1?'mille':' mille'));
  if(r>0)parts.push(fr1000(r,true));
  return parts.join(' ').replace(/\s+/g,' ').trim();
}
function ordW(n){

async function srWords(lv){const d=await loadLevel(lv);return d&&d.words?d.words:null;}
async function srDue(){ // bugün zamanı gelenler
  if(!S.sr)S.sr={};const t=srDay(),by={};
  Object.entries(S.sr).forEach(([k,v])=>{if(v[1]<=t){const i=k.indexOf('|');(by[k.slice(0,i)]=by[k.slice(0,i)]||[]).push({k,w:k.slice(i+1),b:v[0],d:v[1]});}});
  const out=[];
  for(const lv of Object.keys(by)){const ws=await srWords(lv);if(!ws)continue;const m={};ws.forEach(x=>m[x.w]=x);by[lv].forEach(x=>{const w=m[x.w];if(w)out.push(Object.assign({},x,{tr:w.tr,ex:w.ex||'',lv}));});}
  return out.sort((a,b)=>a.d-b.d);
}

// ---- Konuşma Kalıpları: durum bazlı "ne söylenir" rehberi ----
const KAL=(()=>{const o=[];let c=null;KALRAW.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]==='#'){c={t:l.slice(1).trim(),y:[],h:[]};o.push(c);}else if(l[0]==='+'||l[0]==='-'){const p=l.slice(1).split('|').map(x=>x.trim());if(p.length>=2)(l[0]==='+'?c.y:c.h).push([p[0],p[1]]);}});return o;})();
let KL=null,KQ=null;
function rKal(){
  const hd=`<button class="ghost sm" id="bk">← Çalış</button>`;
  if(!KL)KL={s:-1};
  if(KL.s<0){
    $('#app').innerHTML=hd+`<h2>📋 Konuşma Kalıpları</h2><p class="sub">Günlük durumlarda ne söylenir, karşındaki ne der? Dokun ve dinle.</p>`+`<button id="kq" style="width:100%;margin-bottom:10px">🎯 Hepsinden sına (10 soru)</button>`+KAL.map((x,i)=>`<button class="ghost" data-s="${i}" style="width:100%;text-align:left;margin-bottom:6px">${esc(x.t)} <span class="small">• ${x.y.length+x.h.length} kalıp</span></button>`).join('');
    $('#bk').onclick=toWork;$('#kq').onclick=()=>kqStart(-1);document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{KL={s:+b.dataset.s};rKal();});return;}
  const x=KAL[KL.s];
  const rows=(arr,k)=>arr.map((p,i)=>`<div class="card" style="padding:10px;margin:6px 0"><div style="display:flex;gap:8px;align-items:center"><button class="ghost sm" data-say="${k}${i}">🔊</button><div style="flex:1"><b>${esc(p[0])}</b><div class="small">🇹🇷 ${esc(p[1])}</div></div><button class="ghost sm" data-nb="${k}${i}" title="Deftere ekle">📒</button></div></div>`).join('');
  $('#app').innerHTML=hd.replace('← Çalış','← Durumlar')+`<h2>${esc(x.t)}</h2><button id="kq" style="width:100%">🎯 Bu durumu sına</button><h3 style="margin:10px 0 4px">🗣️ Sen söyleyebilirsin</h3>${rows(x.y,'y')}<h3 style="margin:14px 0 4px">👂 Karşındaki söyleyebilir</h3>${rows(x.h,'h')}`;
  $('#bk').onclick=()=>{KL=null;rKal();};$('#kq').onclick=()=>kqStart(KL.s);
  const get=k=>{const a=k[0]==='y'?x.y:x.h;return a[+k.slice(1)];};
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(get(b.dataset.say)[0],.8));
  document.querySelectorAll('[data-nb]').forEach(b=>b.onclick=()=>{const p=get(b.dataset.nb);toast(nbAdd(p[0],p[1],'')?'📒 Deftere eklendi':'Zaten defterinde');});
}

function kqStart(si){
  const all=[];KAL.forEach((c,ci)=>c.y.concat(c.h).forEach(p=>all.push({p,ci})));
  const pool=si<0?all:all.filter(a=>a.ci===si);
  const qs=shuffle(pool.slice()).slice(0,si<0?10:Math.min(8,pool.length)).map(a=>{
    const d=shuffle(all.filter(b=>b.p[0]!==a.p[0])).slice(0,3).map(b=>b.p[0]);
    return {tr:a.p[1],ans:a.p[0],opts:shuffle([a.p[0]].concat(d))};});
  KQ={si,qs,k:0,ok:0,first:true,done:false};view='kq';render();
}
function rKq(){
  if(!KQ){view='kal';return rKal();}
  const n=KQ.qs.length;
  if(KQ.k>=n){bump(5);save();
    $('#app').innerHTML=`<h2>🎉 Bitti!</h2><div class="card" style="text-align:center"><div style="font-size:42px;font-weight:800">${KQ.ok} / ${n}</div><p>ilk seferde doğru</p></div><div class="row"><button id="ag">Tekrar</button><button class="ghost" id="bk">Kalıplar</button></div>`;
    $('#ag').onclick=()=>kqStart(KQ.si);$('#bk').onclick=()=>{KQ=null;KL=null;view='kal';render();};return;}
  const q=KQ.qs[KQ.k];
  $('#app').innerHTML=`<button class="ghost sm" id="bk">← Kalıplar</button><p class="sub">${KQ.k+1} / ${n}</p><div class="bar"><i style="width:${KQ.k/n*100}%"></i></div><div class="card"><div class="small">Şunu nasıl söylersin?</div><b style="font-size:19px">🇹🇷 ${esc(q.tr)}</b><div style="margin-top:10px">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="nx"></div></div>`;
  $('#bk').onclick=()=>{KQ=null;KL=null;view='kal';render();};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(KQ.done)return;
    if(q.opts[+b.dataset.i]===q.ans){b.classList.add('ok');KQ.done=true;if(KQ.first){KQ.ok++;xpa(2);}document.querySelectorAll('.opt').forEach(o=>o.disabled=true);say(q.ans,.8);
      $('#nx').innerHTML=`<button id="nb" style="margin-top:8px">${KQ.k+1>=n?'Bitir':'Devam'} ➜</button>`;$('#nb').onclick=()=>{KQ.k++;KQ.first=true;KQ.done=false;rKq();};}
    else{if(KQ.first)misAdd({t:'x',q:q.tr+' — nasıl söylersin?',o:q.opts.slice(),a:q.ans});KQ.first=false;b.classList.add('bad');b.disabled=true;}});
}

// ---- Boşluk Doldur (cümleden kelime çıkar, 4 seçenek) ----
let GP=null;
function gapMake(){
  const ex=spkExtra().filter(x=>x.tr&&x.en.split(/\s+/).length>=4&&x.en.split(/\s+/).length<=12);
  const strip=w=>w.replace(/^[^A-Za-zÀ-ÿœŒ]+|[^A-Za-zÀ-ÿœŒ]+$/g,'');
  const cand=[];ex.forEach(x=>{x.en.split(/\s+/).forEach(w=>{const c=strip(w);if(c.length>=4&&!/['’-]/.test(c))cand.push(c.toLowerCase());});});
  const uniq=[...new Set(cand)];
  const items=[];
  shuffle(ex.slice()).forEach(x=>{if(items.length>=10)return;
    const ws=x.en.split(/\s+/),ix=ws.map((w,i)=>[w,i]).filter(a=>{const c=strip(a[0]);return c.length>=4&&!/['’-]/.test(c);});
    if(!ix.length)return;const [w,i]=pick(ix),c=strip(w),lc=c.toLowerCase();
    const sc=u=>(u.slice(-3)===lc.slice(-3)?3:u.slice(-2)===lc.slice(-2)?2:u.slice(-1)===lc.slice(-1)?1:0)*2-Math.abs(u.length-lc.length)*0.5+Math.random()*1.5;
    const prev=i>0?strip(ws[i-1]).toLowerCase():'';
    const ds=uniq.filter(u=>u!==lc&&Math.abs(u.length-lc.length)<=3&&u[0]!==lc[0]&&!(prev&&u===prev)).sort((a,b)=>sc(b)-sc(a)).slice(0,3);if(ds.length<3)return;
    const cap=c[0]!==lc[0];const f=s=>cap?s[0].toUpperCase()+s.slice(1):s;
    const q=ws.map((t,j)=>j===i?t.replace(c,'_____'):t).join(' ');
    items.push({q,tr:x.tr,fr:x.en,a:f(lc),o:shuffle([f(lc)].concat(ds.map(f)))});});
  return items;
}
async function rGap(){
  if(!GP||GP.lvl!==S.lvl){const pl=await needPool('🧩 Boşluk Doldur','gap');if(!pl)return;GP={lvl:S.lvl,items:gapMake(),k:0,ok:0,first:true,done:false};}
  const hd=`<button class="ghost sm" id="bk">← Çalış</button>`;
  if(!GP.items.length){$('#app').innerHTML=hd+`<h2>🧩 Boşluk Doldur</h2><div class="card">Bu seviyede uygun cümle bulunamadı.</div>`;$('#bk').onclick=toWork;return;}
  const n=GP.items.length;
  if(GP.k>=n){bump(5);cnt('cloze',GP.ok);save();
    $('#app').innerHTML=`<h2>🎉 Bitti!</h2><div class="card" style="text-align:center"><div style="font-size:42px;font-weight:800">${GP.ok} / ${n}</div><p>ilk seferde doğru</p></div><div class="row"><button id="ag">Yeni set</button><button class="ghost" id="bk">Çalış merkezi</button></div>`;
    $('#ag').onclick=()=>{GP=null;rGap();};$('#bk').onclick=()=>{GP=null;toWork();};return;}
  const it=GP.items[GP.k];
  $('#app').innerHTML=hd+`<h2>🧩 Boşluk Doldur</h2><p class="sub">${GP.k+1} / ${n} • ${S.lvl}</p><div class="bar"><i style="width:${GP.k/n*100}%"></i></div>
  <div class="card"><div class="small">🇹🇷 ${esc(it.tr)}</div><b style="font-size:19px;display:block;margin:8px 0">${esc(it.q)}</b><div>${it.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="nx"></div></div>`;
  $('#bk').onclick=()=>{GP=null;toWork();};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(GP.done)return;
    if(it.o[+b.dataset.i]===it.a){b.classList.add('ok');GP.done=true;if(GP.first){GP.ok++;xpa(3);}document.querySelectorAll('.opt').forEach(o=>o.disabled=true);say(it.fr,.8);
      $('#nx').innerHTML=`<p class="small">✅ ${esc(it.fr)}</p><button id="nb" style="margin-top:8px">${GP.k+1>=n?'Bitir':'Devam'} ➜</button>`;$('#nb').onclick=()=>{GP.k++;GP.first=true;GP.done=false;rGap();};}
    else{if(GP.first)misAdd({t:'x',q:it.tr+' — '+it.q,o:it.o.slice(),a:it.a});GP.first=false;b.classList.add('bad');b.disabled=true;}});
}

let P2={tab:'rgl',v:-1,rate:.6,res:null,msg:'',listening:false};
function rPr2(){
  const hd=`<button class="ghost sm" id="bk">← Çalış</button>`;
  const chips=`<div class="row" style="margin:8px 0"><button class="chip ${P2.tab==='rgl'?'sel':''}" data-t="rgl">📖 Okunuş Rehberi</button><button class="chip ${P2.tab==='vir'?'sel':''}" data-t="vir">🌀 Virelangue</button></div>`;
  const tabs=()=>document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{try{REC&&REC.abort();}catch(e){}P2={tab:b.dataset.t,v:-1,rate:.6,res:null,msg:'',listening:false};rPr2();});
  const sayb=()=>document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say,.7));
  if(P2.tab==='rgl'){
    $('#app').innerHTML=hd+`<h2>📖 Okunuş Rehberi</h2><p class="sub">Harflerin Fransızcada nasıl okunduğu. Dokun ve dinle.</p>${chips}`+RGL.map(r=>`<div class="card"><div style="font-size:20px;font-weight:800">${esc(r[0])}</div><div>${esc(r[1])}</div><div class="row" style="margin-top:6px;flex-wrap:wrap">${r[3].map(w=>`<button class="ghost sm" data-say="${esc(w)}">🔊 ${esc(w)}</button>`).join('')}</div></div>`).join('');
    $('#bk').onclick=toWork;tabs();sayb();return;}
  if(P2.v<0){
    $('#app').innerHTML=hd+`<h2>🌀 Virelangue</h2><p class="sub">Fransızca tekerlemeler. Yavaş başla, hızlan.</p>${chips}`+VIR.map((x,i)=>`<button class="ghost" data-v="${i}" style="width:100%;text-align:left;margin-bottom:6px">${esc(x[0])}<br><span class="small">${esc(x[1])}</span></button>`).join('');
    $('#bk').onclick=toWork;tabs();document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{P2.v=+b.dataset.v;P2.res=null;P2.msg='';rPr2();});return;}
  const it=VIR[P2.v],r=P2.res;
  const shown=r?it[0].split(' ').map(w=>{const nw=normW(w)[0];return `<span style="padding:1px 4px;border-radius:5px;background:${!nw||r.hit.has(nw)?'#d1fae5':'#fee2e2'}">${esc(w)}</span>`;}).join(' '):esc(it[0]);
  $('#app').innerHTML=`<button class="ghost sm" id="bk">← Liste</button><h2>🌀 Virelangue</h2><div class="card"><p style="font-size:21px;line-height:1.5;margin:6px 0">${shown}</p><p class="small">🇹🇷 ${esc(it[1])}</p>
  <div class="row" style="margin:8px 0"><span class="small">Hız:</span>${[['🐢',.5],['🚶',.7],['🏃',.9]].map(x=>`<button class="chip ${P2.rate===x[1]?'sel':''}" data-r="${x[1]}">${x[0]} ${x[1]}x</button>`).join('')}</div><button class="ghost" id="pl">🔊 Dinle</button></div>
  ${SR?`<div class="row"><button id="mic" ${P2.listening?'disabled':''} style="flex:1;padding:16px;font-size:18px;background:${P2.listening?'#db2777':'var(--pri)'}">${P2.listening?'🎙️ Dinliyorum…':'🎤 Söyle'}</button></div>`:'<div class="card small">Konuşma tanıma bu tarayıcıda yok; sadece dinleyip tekrar edebilirsin.</div>'}
  ${P2.msg?`<div class="card" style="background:#fffbeb">${esc(P2.msg)}</div>`:''}${r?`<div class="card" style="background:${r.ok?'#ecfdf5':'#fffbeb'}">${r.ok?'✅ Harika!':'🟠 Biraz daha yavaş dene.'} Skor: <b>%${r.sc}</b><p class="small">Duyduğum: “${esc(r.heard)}”</p></div>`:''}
  <div class="row"><button class="ghost" id="pv">← Önceki</button><button id="nx">Sonraki ➜</button></div>`;
  $('#bk').onclick=()=>{try{REC&&REC.abort();}catch(e){}P2.v=-1;P2.res=null;P2.msg='';rPr2();};
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{P2.rate=+b.dataset.r;rPr2();});
  $('#pl').onclick=()=>say(it[0],P2.rate);
  $('#nx').onclick=()=>{P2.v=(P2.v+1)%VIR.length;P2.res=null;P2.msg='';rPr2();};
  $('#pv').onclick=()=>{P2.v=(P2.v-1+VIR.length)%VIR.length;P2.res=null;P2.msg='';rPr2();};
  if($('#mic'))$('#mic').onclick=()=>{
    try{speechSynthesis.cancel();}catch(e){}
    let got=false;REC=new SR();REC.lang='fr-FR';REC.interimResults=false;REC.maxAlternatives=3;
    REC.onresult=ev=>{got=true;const b=normW(it[0]);let best=null;
      for(let i=0;i<ev.results[0].length;i++){const h=ev.results[0][i].transcript,a=normW(h),L=lcs(a,b),sc=Math.round(L.n/b.length*100);if(!best||sc>best.sc)best={heard:h,sc,hit:new Set(b.filter((_,j)=>L.B.has(j)))};}
      const ok=best.sc>=70;if(ok){xpa(4);cnt('speak');}else xpa(1);
      P2.res={ok,sc:best.sc,heard:best.heard,hit:best.hit};P2.listening=false;P2.msg='';if(view==='pr2')rPr2();};
    REC.onerror=ev=>{got=true;P2.listening=false;P2.msg=ev.error==='not-allowed'||ev.error==='service-not-allowed'?'Mikrofon izni verilmedi. Tarayıcı ayarlarından izin ver.':ev.error==='no-speech'?'Ses duyamadım, tekrar dene.':'Bir sorun oldu ('+ev.error+'). Tekrar dene.';if(view==='pr2')rPr2();};
    REC.onend=()=>{if(!got&&view==='pr2'){P2.listening=false;P2.msg='Ses duyamadım, tekrar dene.';rPr2();}};
    try{REC.start();P2.listening=true;P2.msg='';rPr2();}catch(e){P2.listening=false;}
  };
}

function cuQuiz(tab){
  const src=tab==='prv'?PRV:COG,n=Math.min(10,src.length),idx=[...src.keys()].sort(()=>Math.random()-.5).slice(0,n);
  return {k:0,ok:0,first:true,done:false,items:idx.map(i=>{
    const it=src[i];let q,a,pool;
    if(tab==='prv'){q=it[0];a=it[1];pool=PRV.map(x=>x[1]);}else{q=it[0];a=it[1];pool=COG.map(x=>x[1]);}
    const wrong=pool.filter(x=>x!==a).sort(()=>Math.random()-.5).slice(0,3);
    return {q,a,tr:tab==='prv'?it[2]:it[2],o:[a,...wrong].sort(()=>Math.random()-.5),fr:tab==='prv'?it[0]:it[1]};})};
}

let MQ=null;
function mqItems(id){
  if(id==='hom')return shuffle(HOM).slice(0,10).map(x=>({q:x[0],o:shuffle(x[1].slice()),a:x[2],tr:x[3],fill:true}));
  return shuffle(LIA).slice(0,10).map(x=>({q:x[0],o:shuffle([x[1],...x[2]]),a:x[1],tr:x[3],say:x[0]}));
}
function rMq(id){
  const hd=`<button class="ghost sm" id="bk">← Çalış</button>`,title=id==='hom'?'🔤 Ses & Yazım':'🔗 Bağlama (Liaison)';
  if(!MQ||MQ.id!==id)MQ={id,items:mqItems(id),k:0,ok:0,first:true,done:false};
  const N=MQ,n=N.items.length;
  if(N.k>=n){bump(6);cnt(id,N.ok);save();
    $('#app').innerHTML=hd+`<h2>🎉 Bitti!</h2><div class="card" style="text-align:center"><div style="font-size:42px;font-weight:800">${N.ok} / ${n}</div><p>soruyu ilk seferde doğru bildin</p></div><div class="row"><button id="ag">Yeni set</button><button class="ghost" id="bk2">Çalış merkezi</button></div>`;
    $('#bk').onclick=toWork;$('#bk2').onclick=toWork;$('#ag').onclick=()=>{MQ=null;rMq(id);};return;}
  const it=N.items[N.k];
  const q=id==='hom'?`<div style="font-size:22px;font-weight:700;margin:6px 0">${esc(it.q).replace('___','<span style="border-bottom:3px solid #4f46e5;padding:0 14px">&nbsp;&nbsp;</span>')}</div><div class="small">${esc(it.tr)}</div>`
    :`<button id="pl" style="font-size:20px;padding:12px 20px">🔊 Dinle</button><div style="font-size:22px;font-weight:700;margin:10px 0">${esc(it.q)}</div><div class="small">Yaklaşık okunuş hangisi?</div>`;
  $('#app').innerHTML=hd+`<h2>${title}</h2><p class="sub">${N.k+1} / ${n}</p><div class="bar"><i style="width:${N.k/n*100}%"></i></div><div class="card" style="text-align:center">${q}<div id="os" style="text-align:left;margin-top:10px">${it.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="nx"></div></div>`;
  wire();$('#bk').onclick=toWork;
  if(id==='lia'){$('#pl').onclick=()=>say(it.say);setTimeout(()=>{if(view==='mq'&&MQ===N&&N.items[N.k]===it&&!N.done)say(it.say);},300);}
  document.querySelectorAll('#os .opt').forEach(b=>b.onclick=()=>{if(N.done)return;const o=it.o[+b.dataset.i];
    if(o===it.a){N.done=true;if(N.first)N.ok++;xpa(2);b.classList.add('ok');say(it.fill?it.q.replace('___',it.a):it.say);
      $('#nx').innerHTML=`<div class="small" style="margin-top:8px">${it.fill?esc(it.q.replace('___',it.a)):esc(it.tr)}</div><button id="nb" style="margin-top:8px">${N.k+1>=n?'Bitir':'Sonraki'} ➜</button>`;$('#nb').onclick=()=>{N.k++;N.done=false;N.first=true;rMq(id);};}
    else{if(N.first)misAdd({t:'x',q:id==='hom'?it.q+' — '+it.tr:'"'+it.q+'" — okunuşu?',o:it.o,a:it.a});N.first=false;b.classList.add('bad');b.disabled=true;}});
}

let NQ=null;
function rNum(){
  const hd=`<button class="ghost sm" id="bk">← Çalış</button>`,cl=t=>String(t).replace(ZW,'');
  if(!NQ||NQ.lvl!==S.lvl){NQ={lvl:S.lvl,k:0,ok:0,first:true,done:false,n:10,cur:null};}
  const N=NQ;
  if(N.k>=N.n){bump(6);cnt('num',N.ok);save();
    $('#app').innerHTML=hd+`<h2>🎉 Bitti!</h2><div class="card" style="text-align:center"><div style="font-size:42px;font-weight:800">${N.ok} / ${N.n}</div><p>soruyu ilk seferde doğru bildin</p></div><div class="row"><button id="ag">Yeni set</button><button class="ghost" id="bk2">Çalış merkezi</button></div>`;
    $('#bk').onclick=toWork;$('#bk2').onclick=toWork;$('#ag').onclick=()=>{NQ=null;rNum();};return;}
  if(!N.cur){let q,g=0;do{q=numQ(N.lvl);}while((!q||q.o.length<3)&&g++<20);N.cur=q;}
  const q=N.cur;
  $('#app').innerHTML=hd+`<h2>🔢 Sayı, Saat & Tarih</h2>${chips()}<p class="sub">${N.lvl} • ${N.k+1} / ${N.n}</p><div class="bar"><i style="width:${N.k/N.n*100}%"></i></div>
  <div class="card" style="text-align:center">${q.say?`<button id="pl" style="font-size:22px;padding:14px 22px">🔊 Dinle</button><div class="small" style="margin-top:6px">${q.q.replace(/^🔊 /,'')}</div>`:q.q}
  <div id="os" style="text-align:left;margin-top:10px">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(cl(o))}</button>`).join('')}</div><div id="nx"></div></div>`;
  wire();$('#bk').onclick=toWork;
  if(q.say){$('#pl').onclick=()=>say(q.say);setTimeout(()=>{if(view==='num'&&NQ===N&&N.cur===q&&!N.done)say(q.say);},300);}
  document.querySelectorAll('#os .opt').forEach(b=>b.onclick=()=>{if(N.done)return;const o=q.o[+b.dataset.i];
    if(o===q.a){N.done=true;if(N.first)N.ok++;xpa(2);b.classList.add('ok');say(q.say||q.a);
      $('#nx').innerHTML=`<button id="nb">${N.k+1>=N.n?'Bitir':'Sonraki'} ➜</button>`;$('#nb').onclick=()=>{N.done=false;N.first=true;N.k++;N.cur=null;rNum();};}
    else{if(N.first)misAdd({t:'x',q:cl(q.mq),o:q.o.map(cl),a:cl(q.a)});N.first=false;b.classList.add('bad');b.disabled=true;}});
}

}

// ---- üyelik kodu (içerik şifreli) ----
// Görünmez parmak izi: kopyalanan metinden üye numarası okunabilir (admin/decode.js)
function tag(){let t='\u2060';for(let b=7;b>=0;b--)t+=((WID>>b)&1)?'\u200c':'\u200b';return t;}
function mark(x){
  if(typeof x!=='string'||x.length<60||!WID)return x;
  const t=tag(),pos=[.2,.5,.8].map(f=>Math.floor(x.length*f));let out=x,add=0;
  for(const p of pos){let i=out.indexOf(' ',p+add);if(i<0||i+3>=out.length)continue;i+=2;if(out[i-1]===' '||out[i]===' ')continue;out=out.slice(0,i)+t+out.slice(i);add+=t.length;}
  return out;
}
function stamp(d){if(!WID)return d;(d.stories||[]).forEach(s=>{s.en=mark(s.en);s.tr=mark(s.tr);});(d.practice||[]).forEach(p=>{p.text=mark(p.text);});return d;}
const KEYS=[];const KSALT='bdef000529e9bbe9c093820be1d91a7a';const API='https://ecoach.englishcoach-app.workers.dev';
function devId(){let d='';try{d=localStorage.getItem('ec_dev')||'';}catch(e){}if(!d){d=hexs(crypto.getRandomValues(new Uint8Array(16)));try{localStorage.setItem('ec_dev',d);}catch(e){}}return d;}
let LK={},WM='',WID=0,WEXP='',GERR='';
const b64=s=>Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));
const hexb=s=>Uint8Array.from(s.match(/../g),x=>parseInt(x,16));
const hexs=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function tryCode(code){
  code=normCode(code);if(code.length!==10||!(window.crypto&&crypto.subtle))return null;
  try{
    const sub=crypto.subtle,base=await sub.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits']);
    const bits=new Uint8Array(await sub.deriveBits({name:'PBKDF2',salt:hexb(KSALT),iterations:150000,hash:'SHA-256'},base,512));
    const tg=hexs(bits.slice(0,16));TG=tg;let W,X='';
    if(API){
      try{const r=await fetch(API+'/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t:tg,d:devId(),a:'fr'})}),j=await r.json();
        if(!r.ok){GERR=j.e||'bad';if(j.e==='bad'||j.e==='exp'){try{localStorage.removeItem('ec_w');}catch(e){}}return null;}
        W=j.w;X=j.x||'';try{localStorage.setItem('ec_w',tg+'|'+W+'|'+X);}catch(e){}
      }catch(e){let c='';try{c=localStorage.getItem('ec_w')||'';}catch(x){}const p=c.split('|');if(p[0]!==tg||!p[1]){GERR='net';return null;}W=p[1];X=p[2]||'';}
    }else{const e=KEYS.find(k=>k.t===tg);if(!e)return null;W=e.w;}
    const wk=await sub.importKey('raw',bits.slice(32),'AES-GCM',false,['decrypt']),raw=b64(W);
    const o=JSON.parse(new TextDecoder().decode(await sub.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},wk,raw.slice(12))));
    if(!API&&o.x&&Date.now()>Date.parse(o.x+'T23:59:59')){GERR='exp';return null;}
    LK={};for(const l in o.k)LK[l]=await sub.importKey('raw',b64(o.k[l]),'AES-GCM',false,['decrypt']);WM=o.l;WID=o.i||0;WEXP=X||o.x||'';GERR='';return code;
  }catch(e){return null;}
}
function setWM(){
  let w=$('#wm');if(!w){w=document.createElement('div');w.id='wm';w.style.cssText='position:fixed;inset:0;pointer-events:none;opacity:.07;z-index:9';document.body.appendChild(w);}
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="230" height="130"><text x="115" y="70" text-anchor="middle" font-size="17" font-family="sans-serif" transform="rotate(-20 115 65)">${esc(WM)}</text></svg>`;
  w.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function gmsg(){return GERR==='exp'?'Bu kodun süresi dolmuş. Yenisini iste.':GERR==='dev'?'Bu kod zaten en fazla sayıda cihazda kullanılıyor. Davet eden kişiden sıfırlamasını iste.':GERR==='rate'?'Çok fazla deneme. Biraz sonra tekrar dene.':GERR==='net'?'Sunucuya ulaşılamadı. İnternetini kontrol et.':(window.crypto&&crypto.subtle)?'Kod geçersiz.':'Bu tarayıcı güvenli bağlantı gerektiriyor (https).';}
function showLogin(msg){
  $('#nav').style.display='none';
  $('#app').innerHTML=`<h1>Fransızca Koç</h1><p class="sub">Üyelere özel. Sana verilen kodu yaz.</p><div class="card"><input id="cd" placeholder="XXXXX-XXXXX" autocapitalize="characters" autocomplete="off" style="width:100%;font:inherit;font-size:22px;letter-spacing:2px;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px"><div style="height:10px"></div><button id="lg" style="width:100%">Giriş</button><p id="lm" class="small" style="color:#dc2626">${msg||''}</p></div><p class="small">Kodun yoksa seni davet eden kişiden iste. Kod kişiye özeldir. İçerik yalnızca kişisel kullanım içindir; kopyalanması, çoğaltılması ve paylaşılması yasaktır. Kopyalanan içerik kodunuza kadar izlenebilir.</p>`;
  const go=async()=>{const c=$('#cd').value;$('#lm').textContent='Kontrol ediliyor…';const ok=await tryCode(c);if(!ok){$('#lm').textContent=gmsg();return;}try{localStorage.setItem('ec_code',ok);}catch(e){}startApp();};
  $('#lg').onclick=go;$('#cd').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}
function startApp(){$('#nav').style.display='';setWM();render();setTimeout(autoBackup,4000);}
async function boot(){
  let c='';try{c=localStorage.getItem('ec_code')||'';}catch(e){}
  if(c&&await tryCode(c)){startApp();return;}
  showLogin(GERR?gmsg():c?'Kodun artık geçerli değil.':'');
}
function logout(){try{localStorage.removeItem('ec_code');}catch(e){}LK={};WID=0;try{localStorage.removeItem('ec_w');}catch(e){}Object.keys(DATA).forEach(k=>delete DATA[k]);const w=$('#wm');if(w)w.remove();duelLeave();view='home';showLogin();}
boot();
</script>
